<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Fishing Cat · 钓鱼桌宠</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      height: 100%;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      line-height: 0;
    }
    canvas#game {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: transparent;
      display: block;
      width: 100%;
      height: 100%;
      cursor: default;
    }
    .overlay {
      position: absolute;
      line-height: 1.4;
      color: #e8f6f9;
      font-size: 13px;
    }
    /* 工具菜单覆盖层（音效 / 玩法说明 / 形象 / 钓鱼竿 / 退出） */
    #tools-overlay {
      position: absolute; inset: 0; z-index: 20; display: none;
    }
    #tools-overlay.visible { display: block; }
    #tools-menu {
      position: absolute; right: 8px; bottom: 44px;
      background: rgba(8, 20, 28, 0.96); border: 2px solid #2a6b8f; border-radius: 8px;
      padding: 4px; display: flex; flex-direction: column; gap: 4px; min-width: 104px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }
    #tools-menu button {
      background: #12384f; color: #e8f6f9; border: 1px solid #2a6b8f;
      font-size: 13px; padding: 7px 12px; border-radius: 5px; cursor: pointer; text-align: left;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    #tools-menu button:hover { background: #1a4f6e; }
    /* 工具菜单：设置 ▸ 二级子目录（点击「设置」向左弹出） */
    .submenu {
      position: absolute; right: calc(100% + 6px); top: 0;
      background: rgba(8, 20, 28, 0.98); border: 2px solid #2a6b8f; border-radius: 8px;
      padding: 4px; display: none; flex-direction: column; gap: 4px; min-width: 104px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }
    .submenu.visible { display: flex; }
    .submenu button {
      background: #12384f; color: #e8f6f9; border: 1px solid #2a6b8f;
      font-size: 13px; padding: 7px 12px; border-radius: 5px; cursor: pointer; text-align: left;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif; white-space: nowrap;
    }
    .submenu button:hover { background: #1a4f6e; }
    /* 玩法说明弹窗 */
    #help-overlay {
      position: absolute; inset: 0; z-index: 25; display: none;
      align-items: center; justify-content: center;
    }
    #help-overlay.visible { display: flex; }
    #help-dialog {
      background: rgba(8, 20, 28, 0.96); border: 2px solid #2a6b8f; border-radius: 10px;
      padding: 14px 16px; width: 240px; color: #e8f6f9; font-size: 13px; line-height: 1.65;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }
    #help-dialog p { margin: 0 0 10px; }
    #help-dialog button {
      background: #12384f; color: #e8f6f9; border: 1px solid #2a6b8f;
      padding: 5px 12px; border-radius: 5px; cursor: pointer; display: block; margin-left: auto;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    #help-dialog button:hover { background: #1a4f6e; }
    /* 形象图鉴选择框（卡片式） */
    #char-picker {
      position: absolute; inset: 0; z-index: 26; display: none;
      align-items: center; justify-content: center;
    }
    #char-picker.visible { display: flex; }
    #char-picker .panel {
      background: rgba(8, 20, 28, 0.96); border: 2px solid #2a6b8f; border-radius: 10px;
      padding: 14px 16px; color: #e8f6f9; width: 284px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    #char-picker h3 { margin: 0 0 6px; font-size: 14px; line-height: 1.35; color: #6fc3df; }
    #char-picker .sub { font-size: 11px; line-height: 1.45; color: #9fc4d6; margin: 0 0 12px; }
    .char-grid { display: flex; gap: 14px; justify-content: center; align-items: flex-start; flex-wrap: wrap; }
    .char-card {
      position: relative;
      width: 116px; box-sizing: border-box;
      background: rgba(18, 56, 79, 0.55); border: 2px solid #2a6b8f; border-radius: 8px;
      padding: 8px 8px 10px; text-align: center; cursor: pointer; transition: all .12s;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .char-card:hover { background: rgba(26, 79, 110, 0.85); }
    .char-card.selected { border-color: #6fc3df; box-shadow: 0 0 0 2px rgba(111, 195, 223, 0.55); }
    .char-card img { width: 56px; height: 84px; image-rendering: pixelated; display: block;
      background: rgba(0, 0, 0, 0.25); border-radius: 4px; }
    .char-card .nm { font-size: 12px; color: #e8f6f9; line-height: 1.2; }
    .char-card .ds { font-size: 10px; color: #9fc4d6; line-height: 1.3; word-break: break-word; }
    .char-card .sl {
      position: absolute; top: 4px; right: 6px; font-size: 10px; color: #ffd86b;
      background: rgba(8, 20, 28, 0.7); border-radius: 4px; padding: 1px 4px;
    }
    #char-picker .foot { margin-top: 14px; display: flex; justify-content: flex-end; }
    #char-picker .close {
      background: #12384f; color: #e8f6f9; border: 1px solid #2a6b8f;
      padding: 5px 14px; border-radius: 5px; cursor: pointer; font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    #char-picker .close:hover { background: #1a4f6e; }
    /* 钓鱼竿图鉴（卡片式，仿形象图鉴） */
    #rod-picker {
      position: absolute; inset: 0; z-index: 27; display: none;
      align-items: center; justify-content: center;
    }
    #rod-picker.visible { display: flex; }
    #rod-picker .panel {
      background: rgba(8, 20, 28, 0.96); border: 2px solid #2a6b8f; border-radius: 10px;
      padding: 14px 16px; color: #e8f6f9; width: 308px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    #rod-picker h3 { margin: 0 0 6px; font-size: 14px; line-height: 1.35; color: #6fc3df; }
    #rod-picker .sub { font-size: 11px; line-height: 1.45; color: #9fc4d6; margin: 0 0 12px; }
    .rod-grid { display: flex; gap: 12px; justify-content: center; align-items: flex-start; flex-wrap: wrap; }
    .rod-card {
      position: relative;
      width: 132px; box-sizing: border-box;
      background: rgba(18, 56, 79, 0.55); border: 2px solid #2a6b8f; border-radius: 8px;
      padding: 8px 8px 10px; text-align: center; cursor: pointer; transition: all .12s;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .rod-card:hover { background: rgba(26, 79, 110, 0.85); }
    .rod-card.selected { border-color: #6fc3df; box-shadow: 0 0 0 2px rgba(111, 195, 223, 0.55); }
    .rod-card.locked { opacity: 0.5; cursor: default; filter: grayscale(0.6); }
    .rod-card.locked:hover { background: rgba(18, 56, 79, 0.55); }
    .rod-card img { width: 46px; height: 46px; image-rendering: pixelated; display: block;
      background: rgba(0, 0, 0, 0.25); border-radius: 4px; }
    .rod-card .nm { font-size: 12px; color: #e8f6f9; line-height: 1.2; }
    .rod-card .ds { font-size: 10px; color: #9fc4d6; line-height: 1.3; word-break: break-word; }
    .rod-card .tg { font-size: 10px; color: #ffd86b; line-height: 1.3; min-height: 13px; }
    .rod-card .sl {
      position: absolute; top: 4px; right: 6px; font-size: 10px; color: #ffd86b;
      background: rgba(8, 20, 28, 0.7); border-radius: 4px; padding: 1px 4px;
    }
    #rod-picker .foot { margin-top: 14px; display: flex; justify-content: flex-end; }
    #rod-picker .close {
      background: #12384f; color: #e8f6f9; border: 1px solid #2a6b8f;
      padding: 5px 14px; border-radius: 5px; cursor: pointer; font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    #rod-picker .close:hover { background: #1a4f6e; }
    /* 鱼图鉴（卡片网格，仿钓鱼竿图鉴但更小更密） */
    #fish-picker {
      position: absolute; inset: 0; z-index: 28; display: none;
      align-items: center; justify-content: center;
    }
    #fish-picker.visible { display: flex; }
    #fish-picker .panel {
      background: rgba(8, 20, 28, 0.96); border: 2px solid #2a6b8f; border-radius: 10px;
      padding: 14px 16px; color: #e8f6f9; width: 304px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    #fish-picker h3 { margin: 0 0 6px; font-size: 14px; line-height: 1.35; color: #6fc3df; }
    #fish-picker .sub { font-size: 11px; line-height: 1.45; color: #9fc4d6; margin: 0 0 12px; }
    .fish-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 8px;
      max-height: 286px; overflow-y: auto; padding: 2px;
    }
    .fish-grid::-webkit-scrollbar { width: 6px; }
    .fish-grid::-webkit-scrollbar-thumb { background: rgba(111, 195, 223, 0.5); border-radius: 3px; }
    .fish-card {
      position: relative;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      background: rgba(18, 56, 79, 0.55); border: 2px solid #2a6b8f; border-radius: 8px;
      padding: 7px 4px 6px; text-align: center;
    }
    .fish-card.locked { opacity: 0.85; border-color: #4a6a78; background: rgba(18, 56, 79, 0.3); }
    .fish-card img {
      width: 38px; height: 38px; image-rendering: pixelated; display: block;
      background: rgba(0, 0, 0, 0.25); border-radius: 4px;
    }
    .fish-card.locked img { filter: grayscale(1) brightness(0.45) opacity(0.4); }
    .fish-card .fc-nm { font-size: 11px; color: #e8f6f9; line-height: 1.2; }
    .fish-card.locked .fc-nm { color: #7fa0b0; }
    .fish-card .fc-st {
      font-size: 9px; color: #9fc4d6; line-height: 1.25;
      display: flex; flex-direction: column; gap: 1px;
    }
    .fish-card .fc-st .fc-cnt { color: #ffd86b; }
    #fish-picker .foot { margin-top: 12px; display: flex; justify-content: flex-end; }
    #fish-picker .close {
      background: #12384f; color: #e8f6f9; border: 1px solid #2a6b8f;
      padding: 5px 14px; border-radius: 5px; cursor: pointer; font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    #fish-picker .close:hover { background: #1a4f6e; }
  </style>
</head>
<body>
    <div id="stage">
    <canvas id="game" width="340" height="390"></canvas>
    <div id="help-overlay">
      <div id="help-dialog">
        <p>按住左键蓄力，满力金色 MAX；松开抛竿，等鱼咬钩。小游戏时按住左键让绿条追上鱼，进度满即钓起。按 M 静音，工具菜单可退出。</p>
        <button id="help-close">关闭</button>
      </div>
    </div>
    <div id="char-picker">
      <div class="panel">
        <h3>选择形象</h3>
        <div class="sub">点击下方卡片切换，选择立即生效并记忆</div>
        <div class="char-grid" id="char-grid"></div>
        <div class="foot"><button class="close" id="char-close">关闭</button></div>
      </div>
    </div>
    <div id="rod-picker">
      <div class="panel">
        <h3>钓鱼竿图鉴</h3>
        <div class="sub">升级自动解锁，点击已拥有的竿即可装备</div>
        <div class="rod-grid" id="rod-grid"></div>
        <div class="foot"><button class="close" id="rod-close">关闭</button></div>
      </div>
    </div>
    <div id="fish-picker">
      <div class="panel">
        <h3>鱼图鉴</h3>
        <div class="sub" id="fish-sub">已发现 0 / 15</div>
        <div class="fish-grid" id="fish-grid"></div>
        <div class="foot"><button class="close" id="fish-close">关闭</button></div>
      </div>
    </div>
  </div>
  <script type="module" src="/main.ts"></script>
</body>
</html>
